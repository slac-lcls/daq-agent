# Non-secret prototype settings. Confirm partition before a real investigation.
# This is a proposed report configuration, not a statement of current DAQ state.
hutch = "tmo"
partition = 0
timezone = "America/Los_Angeles"
model = "slac/us.anthropic.claude-sonnet-5"

# Shared LCLS development installation on SDF; CLI flags can override these.
provider_config = "/sdf/group/lcls/ds/dm/apps/dev/opencode/opencode.json"
opencode = "/sdf/group/lcls/ds/dm/apps/dev/code/.opencode/bin/opencode"
# Expanded for the user running the command; runs are grouped by hutch and launch month.
output_root = "~/daq/agent-logs"

# Read-only shared log discovery for the report command.
log_root = "/sdf/home/t/tmoopr/daq/logs"

# Temporary upstream source; branch is descriptive, execution uses the exact SHA.
[daq_skills]
repository = "https://github.com/slac-lcls/lcls2"
branch = "features/psana-daq-monitor"
revision = "198b6aa95229ef0e4ac5023c2a0d2e611124d46e"
directory = "psana/psana/skills"
skills = ["psana-daq", "psana-daq-logs"]
