name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: daq-agent config --config config/hutches/tmo.toml
      - run: daq-agent plan-report --config config/hutches/tmo.toml --from 2026-09-18 --to 2026-09-20
      - name: Prepare synthetic log-analysis workflow without credentials
        run: bash examples/log-analysis/run.sh --prepare-only --output "$RUNNER_TEMP/daq-log-example"
